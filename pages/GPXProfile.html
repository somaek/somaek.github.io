                <text x={hPadding} y={vPadding} fill="#F2F0EB" opacity="0.7" fontSize="10" textAnchor="end" dx="-5" fontFamily="Roboto" className="print:fill-black">{Math.round(effectiveMaxEle)}{unitLabels.alt}</text>
                <text x={hPadding} y={height - vPadding} fill="#F2F0EB" opacity="0.7" fontSize="10" textAnchor="end" dx="-5" fontFamily="Roboto" className="print:fill-black">{Math.round(minEle)}{unitLabels.alt}</text>
                {gridLines.map((line, i) => (
                  <text
                    key={`l-y-${i}`}
                    x={hPadding}
                    y={line.y}
                    fill="#F2F0EB"
                    opacity="0.7"
                    fontSize="10"
                    textAnchor="end"
                    dy="3"
                    dx="-5"
                    fontFamily="Roboto"
                    className="print:fill-black"
                  >
                    {Math.round(line.ele)}{unitLabels.alt}
                  </text>
                ))}

              </svg>
            );
          };

          const defaultTitle = 'Route Profile';

          return (
            <div className="min-h-screen bg-[#1C3322] text-[#F2F0EB] font-roboto selection:bg-[#B84A22] selection:text-white p-4 md:p-8">
              <div className="max-w-6xl mx-auto space-y-8">

                <header className="flex items-center space-x-4 border-b border-[#2e5237] pb-6 print:hidden">
                  <Activity className="w-8 h-8 text-[#D49B35]" />
                  <div>
                    <h1 className="text-3xl font-bold tracking-wide uppercase text-[#F2F0EB] font-oswald">{fileName || defaultTitle}</h1>
                    <p className="text-[#B84A22] text-sm tracking-widest uppercase font-oswald mt-1 font-semibold">GPX PROFILE ANALYZER</p>
                  </div>
                </header>

                {!displayData && (
                    <div className="flex flex-col gap-6">
                      <div
                        className={`
                          border-2 border-dashed rounded-sm p-16 text-center transition-all cursor-pointer group
                          ${dragActive ? 'border-[#D49B35] bg-[#D49B35]/10' : 'border-[#2e5237] hover:border-[#D49B35]/60 bg-[#25422D]'}
                        `}
                        onDragEnter={handleDrag}
                        onDragLeave={handleDrag}
                        onDragOver={handleDrag}
                        onDrop={handleDrop}
                        onClick={() => fileInputRef.current?.click()}
                      >
                        <input
                          ref={fileInputRef}
                          type="file"
                          accept=".gpx,.json"
                          className="hidden"
                          onChange={handleChange}
                        />
                        <div className="flex flex-col items-center gap-6">
                          <div className="w-20 h-20 bg-[#142418] rounded-full flex items-center justify-center group-hover:bg-[#B84A22]/20 transition-colors">
                            <Upload className="w-10 h-10 text-neutral-400 group-hover:text-[#D49B35] transition-colors" />
                          </div>
                          <div>
                            <h3 className="text-2xl font-bold uppercase text-[#F2F0EB] font-oswald tracking-wide">Upload Route File</h3>
                            <p className="text-neutral-400 mt-2 font-light">Drag & drop a .gpx or .json file here to begin climb analysis</p>
                          </div>
                          {isProcessing && <p className="text-[#D49B35] font-bold animate-pulse tracking-widest uppercase">Processing...</p>}
                        </div>
                      </div>

                      {/* --- PRESET ROUTES SELECTION --- */}
                      <div className="mt-8 pt-8 border-t border-[#2e5237] w-full">
                         <h3 className="text-xl font-bold uppercase text-[#F2F0EB] font-oswald tracking-wide mb-4 text-center">OR Select a Standard Route</h3>
                         <div className="flex justify-center">
                             <div className="relative w-full max-w-md">
                                 <select 
                                     onChange={(e) => {
                                         if(e.target.value) loadPresetRoute(e.target.value);
                                     }}
                                     className="w-full bg-[#142418] border border-[#2e5237] text-[#F2F0EB] p-3 pr-10 rounded-sm appearance-none focus:outline-none focus:border-[#D49B35] font-oswald tracking-wide uppercase cursor-pointer transition-colors hover:border-[#D49B35]/50"
                                     defaultValue=""
                                 >
                                     <option value="" disabled>-- Choose an Island Route --</option>
                                     {presetRoutes.length > 0 ? (
                                         presetRoutes.map((route, i) => (
                                             <option key={i} value={route.url}>{route.name}</option>
                                         ))
                                     ) : (
                                         <option disabled>Loading routes...</option>
                                     )}
                                 </select>
                                 <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#F2F0EB]">
                                     <ChevronDown className="w-4 h-4" />
                                 </div>
                             </div>
                         </div>
                      </div>

                    </div>
                )}

                {displayData && (
                  <div className="space-y-6">

                    {/* Controls Bar */}
                    <div className="bg-[#25422D] rounded-sm p-4 border border-[#2e5237] flex flex-wrap items-center justify-between gap-4 print:hidden">
                      
                      {/* Left: Distance Controls */}
                      <div className="flex flex-wrap items-center gap-6">
                        
                        {/* 1. Lap Controls */}
                        <div className="flex items-center gap-3">
                            <div className="bg-[#142418] p-2 rounded-sm hidden sm:block">
                                <RotateCw className="w-5 h-5 text-[#D49B35]" />
                            </div>
                            <div className="flex flex-col">
                                <h3 className="font-bold uppercase text-sm text-[#F2F0EB] font-oswald tracking-wide">Laps</h3>
                                <p className="text-xs text-neutral-400">{getDisplayLaps()} Laps</p>
                            </div>
                            <div className="flex items-center bg-[#142418] rounded-sm p-1 border border-[#2e5237]">
                                <button
                                    onClick={() => adjustLaps(-1)}
                                    className="px-3 py-1 text-neutral-400 hover:text-[#F2F0EB] hover:bg-[#2e5237] rounded-sm transition-colors font-bold"
                                    aria-label="Decrease laps"
                                >-</button>
                                <button
                                    onClick={() => adjustLaps(1)}
                                    className="px-3 py-1 text-neutral-400 hover:text-[#F2F0EB] hover:bg-[#2e5237] rounded-sm transition-colors font-bold"
                                    aria-label="Increase laps"
                                >+</button>
                            </div>
                        </div>

                        {/* Divider */}
                        <div className="w-px h-8 bg-[#2e5237] hidden sm:block"></div>

                        {/* 2. Custom Distance Input */}
                        <div className="flex items-center gap-3">
                            <div className="flex flex-row items-center gap-4">
                                <label className="font-bold uppercase text-xs text-[#D49B35] font-oswald tracking-wide">Custom Distance ({unitLabels.dist})</label>
                                <div className="flex items-center">
                                    <input 
                                        type="number"
                                        min="1"
                                        step="0.5"
                                        value={units === 'metric' ? targetDistance.toFixed(1) : (targetDistance * KM_TO_MILES).toFixed(1)}
                                        onChange={handleDistanceInputChange}
                                        className="bg-[#142418] border border-[#2e5237] text-[#F2F0EB] text-lg font-bold font-oswald px-3 py-1 w-28 rounded-sm focus:outline-none focus:border-[#D49B35] transition-colors"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Divider */}
                        <div className="w-px h-8 bg-[#2e5237] hidden lg:block"></div>
                    
                        {/* Custom Score Filter Input */}
                        <div className="flex items-center gap-3">
                            <div className="flex flex-row items-center gap-4">
                                <label className="font-bold uppercase text-xs text-[#D49B35] font-oswald tracking-wide">Min Score Filter</label>
                                <div className="flex items-center">
                                    <input 
                                        type="number"
                                        min="0"
                                        step="0.5"
                                        value={minScoreThreshold}
                                        onChange={(e) => setMinScoreThreshold(parseFloat(e.target.value) || 0)}
                                        className="bg-[#142418] border border-[#2e5237] text-[#F2F0EB] text-lg font-bold font-oswald px-3 py-1 w-20 rounded-sm focus:outline-none focus:border-[#D49B35] transition-colors"
                                    />
                                </div>
                            </div>
                        </div>

                      </div>

                       {/* Right: Units & Out-And-Back Control */}
                      <div className="flex items-center gap-4">
                        
                        {/* Out and Back Toggle */}
                        <button 
                            onClick={handleToggleOutAndBack}
                            className={`
                                flex items-center gap-2 px-3 py-2 rounded-sm border transition-all text-xs font-bold uppercase tracking-wide
                                ${isOutAndBack 
                                    ? 'bg-[#B84A22] text-[#F2F0EB] border-[#B84A22]' 
                                    : 'bg-[#142418] text-neutral-400 border-[#2e5237] hover:text-[#F2F0EB]'
                                }
                            `}
                        >
                            <ArrowLeftRight className={`w-4 h-4 ${isOutAndBack ? 'text-[#F2F0EB]' : ''}`} />
                            {isOutAndBack ? 'Out & Back' : 'One Way'}
                        </button>
                        
                        {/* Units Group */}
                        <div className="flex items-center gap-3">
                            <div className="bg-[#142418] p-2 rounded-sm hidden sm:block">
                              <Ruler className="w-5 h-5 text-[#D49B35]" />
                            </div>
                            <div className="flex bg-[#142418] rounded-sm p-1 border border-[#2e5237]">
                               <button 
                                 onClick={() => setUnits('metric')}
                                 className={`px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-sm transition-all ${units === 'metric' ? 'bg-[#B84A22] text-[#F2F0EB]' : 'text-neutral-400 hover:text-[#F2F0EB]'}`}
                               >
                                Metric
                               </button>
                               <button 
                                 onClick={() => setUnits('imperial')}
                                 className={`px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-sm transition-all ${units === 'imperial' ? 'bg-[#B84A22] text-[#F2F0EB]' : 'text-neutral-400 hover:text-[#F2F0EB]'}`}
                               >
                                Imperial
                               </button>
                            </div>
                        </div>

                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                      <div className="col-span-2 md:col-span-2">
                        <StatCard
                            title="Stage Type"
                            value={displayData.stageType}
                            icon={<Flag className="w-5 h-5 text-neutral-300" />}
                        />
                      </div>
                      <div className="col-span-1 md:col-span-1">
                        <StatCard
                          title="Profile Score"
                          value={Math.round(displayData.totalScore)}
                          icon={<Activity className="w-5 h-5 text-[#D49B35]" />}
                          highlight
                        />
                      </div>
                      <div className="col-span-1 md:col-span-1">
                        <StatCard
                          title="Distance"
                          value={`${displayData.totalDistance.toFixed(1)} ${unitLabels.dist}`}
                          icon={<FileText className="w-5 h-5 text-neutral-300" />}
                        />
                      </div>
                      <div className="col-span-1 md:col-span-1">
                        <StatCard
                          title="Total Climbing"
                          value={`${Math.round(displayData.totalClimbing)} ${unitLabels.alt}`}
                          icon={<TrendingUp className="w-5 h-5 text-neutral-300" />}
                        />
                      </div>
                    </div>

                    <div className="bg-[#25422D] rounded-sm p-6 border border-[#2e5237] shadow-xl overflow-hidden print:bg-white print:border-black relative">
                      <div className="absolute top-0 right-0 p-2 opacity-10 pointer-events-none">
                        <Mountain className="w-32 h-32 text-[#D49B35]" />
                      </div>
                      <div className="flex justify-between items-center mb-6 relative z-10">
                        <h3 className="font-bold text-xl uppercase tracking-wide flex items-center gap-2 font-oswald text-[#F2F0EB] print:text-black">
                          <span className="w-2 h-8 bg-[#B84A22] inline-block mr-2"></span>
                          Elevation Profile
                        </h3>
                      </div>

                      <div className="h-64 w-full relative z-10">
                        <ElevationChart
                          points={displayData.points}
                          climbs={displayData.climbs}
                          totalDistance={displayData.totalDistance}
                          minEle={displayData.minEle}
                          maxEle={displayData.maxEle}
                          unitLabels={unitLabels}
                        />
                      </div>
                    </div>

                    <div className="bg-[#25422D] rounded-sm overflow-hidden border border-[#2e5237] shadow-lg">
                      <div className="p-5 border-b border-[#2e5237] bg-[#142418] flex justify-between items-end">
                        <div>
                          <h3 className="font-bold text-xl uppercase tracking-wide text-[#F2F0EB] font-oswald">Scored Climbs</h3>
                          <p className="text-xs text-neutral-400 mt-1">Click any climb to view 10-segment analysis</p>
                        </div>
                        <button
                          onClick={() => setShowClimbName(prev => !prev)}
                          className="px-3 py-1 bg-[#1C3322] hover:bg-[#25422D] border border-[#2e5237] text-neutral-300 hover:text-[#F2F0EB] rounded-sm text-xs font-bold uppercase tracking-widest flex items-center gap-1 transition-colors print:hidden"
                        >
                          {showClimbName ? <Eye className="w-4 h-4" /> : <EyeOff className="w-4 h-4" />}
                          {showClimbName ? 'Hide Names' : 'Show Names'}
                        </button>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="text-neutral-400 bg-[#142418] uppercase text-xs font-bold tracking-wider font-oswald">
                                <tr>
                                    <th className="px-6 py-4 w-10 border-b border-[#2e5237]">No.</th>
                                    {showClimbName && <th className="px-6 py-4 w-64 border-b border-[#2e5237]">Climb Name</th>}
                                    <th className="px-6 py-4 border-b border-[#2e5237]">To Finish</th>
                                    <th className="px-6 py-4 border-b border-[#2e5237]">Length</th>
                                    <th className="px-6 py-4 border-b border-[#2e5237]">Avg %</th>
                                    <th className="px-6 py-4 border-b border-[#2e5237]">Max %</th>
                                    <th className="px-6 py-4 border-b border-[#2e5237]">Raw Score</th>
                                    <th className="px-6 py-4 border-b border-[#2e5237]">Category</th> 
                                    <th className="px-6 py-4 border-b border-[#2e5237] text-right w-24">Actions</th>
                                </tr>
                            </thead>
                          <tbody>
                            {displayData.climbs.length === 0 ? (
                              <tr><td colSpan={showClimbName ? "9" : "8"} className="p-8 text-center text-neutral-500 italic print:text-black">No significant climbs detected.</td></tr>
                            ) : (
                              displayData.climbs.map((climb, idx) => (
                                <tr 
                                  key={idx} 
                                  onClick={() => setSelectedClimb(climb)}
                                  className="hover:bg-[#142418]/80 border-b border-[#2e5237]/50 last:border-0 transition-colors group cursor-pointer print:text-black"
                                >
                                  <td className="px-6 py-3 font-bold text-[#D49B35] font-oswald print:text-black">
                                    {climb.id}
                                  </td>
                                   {showClimbName && (
                                      <td className="px-6 py-3" onClick={e => e.stopPropagation()}>
                                          <input
                                            type="text"
                                            placeholder="NAME..."
                                            value={climb.name || ''}
                                            onChange={(e) => updateClimbName(idx, e.target.value)}
                                            className="bg-[#142418] border border-[#2e5237] text-[#F2F0EB] px-2 py-1 rounded-sm w-full font-oswald tracking-wide focus:outline-none focus:border-[#D49B35]"
                                          />
                                      </td>
                                   )}
                                  <td className="px-6 py-3 font-medium text-neutral-300 print:text-black">
                                    {climb.distFromFinish.toFixed(1)} {unitLabels.dist}
                                  </td>
                                  <td className="px-6 py-3 font-medium text-neutral-300 print:text-black">
                                    {climb.lengthKm.toFixed(2)} {unitLabels.dist}
                                  </td>
                                  <td className="px-6 py-3 font-medium text-neutral-300 print:text-black">
                                    {climb.gradientAvg.toFixed(1)}%
                                  </td>
                                  <td className="px-6 py-3 font-medium text-neutral-300 print:text-black">
                                    {climb.maxGradient.toFixed(1)}%
                                  </td>
                                  <td className="px-6 py-3 font-bold">
                                    <span className={`px-2 py-1 rounded-sm text-xs font-oswald ${getScoreClass(climb.rawScore)}`}>
                                      {climb.rawScore.toFixed(1)}
                                    </span>
                                  </td>
                                  <td className="px-6 py-3 font-bold">
                                    {getClimbCategory(climb.rawScore) ? (
                                      <span className="px-2 py-0.5 bg-[#B84A22]/20 border border-[#B84A22]/50 text-[#F2F0EB] text-xs font-oswald rounded-sm">
                                        Cat {getClimbCategory(climb.rawScore)}
                                      </span>
                                    ) : (
                                      <span className="text-neutral-500 text-xs">-</span>
                                    )}
                                  </td>
                                  <td className="px-6 py-3 text-right" onClick={e => e.stopPropagation()}>
                                     {idx < displayData.climbs.length - 1 && (
                                         <button 
                                            onClick={() => mergeClimbs(idx)}
                                            className="px-2 py-1 bg-[#142418] hover:bg-[#B84A22] text-neutral-300 hover:text-[#F2F0EB] border border-[#2e5237] rounded-sm text-xs font-oswald uppercase transition-colors"
                                            title="Merge with next climb"
                                         >
                                            Merge ↓
                                         </button>
                                     )}
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Final 5k Analysis Trigger Card */}
                    <div className="bg-[#25422D] rounded-sm p-6 border border-[#2e5237] flex justify-between items-center">
                        <div>
                            <h3 className="font-bold text-xl uppercase tracking-wide text-[#F2F0EB] font-oswald">Final Run-In Technical Map</h3>
                            <p className="text-xs text-neutral-400 mt-1">View overhead trajectory and terrain profile for the closing stretch</p>
                        </div>
                        <button 
                            onClick={() => setShowFinalAnalysis(true)}
                            className="px-5 py-2.5 bg-[#B84A22] hover:bg-[#B84A22]/80 text-[#F2F0EB] font-bold font-oswald tracking-wide uppercase rounded-sm shadow-md transition-all flex items-center gap-2"
                        >
                            <MapIcon className="w-5 h-5" />
                            Analyze Final Run-In
                        </button>
                    </div>

                  </div>
                )}

                {/* Modals */}
                {selectedClimb && (
                    <ClimbDetailModal 
                        climb={selectedClimb}
                        allPoints={displayData.points}
                        units={units}
                        unitLabels={unitLabels}
                        onClose={() => setSelectedClimb(null)}
                    />
                )}

                {showFinalAnalysis && displayData && (
                    <FinalSegmentModal 
                        points={displayData.points}
                        totalDistance={displayData.totalDistance}
                        units={units}
                        unitLabels={unitLabels}
                        onClose={() => setShowFinalAnalysis(false)}
                    />
                )}

              </div>
            </div>
          );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
