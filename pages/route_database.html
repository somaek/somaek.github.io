<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Database</title>
    <!-- Same scripts and libraries from your analyzer -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');
        
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .font-roboto { font-family: 'Roboto', sans-serif; }
        body { font-family: 'Roboto', sans-serif; background-color: #2c0c5c; }
        h1, h2, h3, h4 { font-family: 'Oswald', sans-serif; }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2c0c5c; }
        ::-webkit-scrollbar-thumb { background: #6c3f9c; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00FFFF; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Icons
        const Activity = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12H18l-5 9L9 3l-5 9H2"/></svg>;
        const Download = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const ArrowUpDown = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>;
        const Search = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const Filter = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;

        const App = () => {
            const [routes, setRoutes] = useState([]);
            const [loading, setLoading] = useState(true);
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });

            // Filter States
            const [searchTerm, setSearchTerm] = useState('');
            const [filters, setFilters] = useState({
                distMin: '', distMax: '',
                eleMin: '', eleMax: '',
                scoreMin: '', scoreMax: ''
            });
            const [uniqueStageTypes, setUniqueStageTypes] = useState([]);
            const [selectedTypes, setSelectedTypes] = useState([]);

            // Fetch Data
            useEffect(() => {
                fetch('https://raw.githubusercontent.com/somaek/somaek.github.io/refs/heads/main/gpx/index.json')
                    .then(res => res.json())
                    .then(data => {
                        setRoutes(data);
                        
                        // Extract unique stage types dynamically
                        const types = new Set();
                        data.forEach(r => {
                            if(r.stage_type) types.add(r.stage_type);
                        });
                        setUniqueStageTypes(Array.from(types).sort());
                        
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Error loading routes:", err);
                        setLoading(false);
                    });
            }, []);

            // Handle Input Changes for precise number filters
            const handleFilterChange = (e, field) => {
                setFilters(prev => ({ ...prev, [field]: e.target.value }));
            };

            // Toggle Stage Types
            const toggleType = (type) => {
                setSelectedTypes(prev => 
                    prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]
                );
            };

            // Download handler
            const handleDownload = (e, fileName, routeName) => {
                e.preventDefault();
                const rawUrl = `https://raw.githubusercontent.com/somaek/somaek.github.io/refs/heads/main/gpx/${fileName}`;
                
                fetch(rawUrl)
                    .then(response => response.blob())
                    .then(blob => {
                        const blobUrl = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = `${routeName}.gpx`; 
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(blobUrl);
                    })
                    .catch(err => console.error('Download failed:', err));
            };

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            // 1. Filter the Data
            const filteredRoutes = useMemo(() => {
                return routes.filter(route => {
                    const matchName = route.name.toLowerCase().includes(searchTerm.toLowerCase());
                    
                    const dMin = filters.distMin === '' ? 0 : parseFloat(filters.distMin);
                    const dMax = filters.distMax === '' ? 99999 : parseFloat(filters.distMax);
                    const matchDist = route.distance_km >= dMin && route.distance_km <= dMax;

                    const eMin = filters.eleMin === '' ? 0 : parseFloat(filters.eleMin);
                    const eMax = filters.eleMax === '' ? 99999 : parseFloat(filters.eleMax);
                    const matchEle = route.elevation_m >= eMin && route.elevation_m <= eMax;

                    const sMin = filters.scoreMin === '' ? 0 : parseFloat(filters.scoreMin);
                    const sMax = filters.scoreMax === '' ? 99999 : parseFloat(filters.scoreMax);
                    const score = route.profile_score || 0;
                    const matchScore = score >= sMin && score <= sMax;

                    const matchType = selectedTypes.length === 0 || selectedTypes.includes(route.stage_type);

                    return matchName && matchDist && matchEle && matchScore && matchType;
                });
            }, [routes, searchTerm, filters, selectedTypes]);

            // 2. Sort the Filtered Data
            const sortedRoutes = useMemo(() => {
                let sortableItems = [...filteredRoutes];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];

                        if (aValue === null || aValue === undefined) aValue = 0;
                        if (bValue === null || bValue === undefined) bValue = 0;

                        if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableItems;
            }, [filteredRoutes, sortConfig]);

            const SortHeader = ({ label, sortKey }) => (
                <th 
                    className="px-6 py-4 cursor-pointer hover:text-[#00FFFF] transition-colors select-none"
                    onClick={() => requestSort(sortKey)}
                >
                    <div className="flex items-center gap-2">
                        {label}
                        <ArrowUpDown className={`w-4 h-4 ${sortConfig.key === sortKey ? 'text-[#00FFFF]' : 'text-neutral-500'}`} />
                    </div>
                </th>
            );

            // UI Components
            return (
                <div className="min-h-screen text-white selection:bg-[#00FFFF] selection:text-black p-4 md:p-8">
                    <div className="max-w-7xl mx-auto space-y-8">
                        
                        <header className="flex items-center space-x-4 border-b border-[#6c3f9c] pb-6">
                            <Activity className="w-8 h-8 text-[#00FFFF]" />
                            <div>
                                <h1 className="text-3xl font-bold tracking-wide uppercase text-white font-oswald">Route Database</h1>
                                <p className="text-neutral-300 text-sm tracking-widest uppercase font-oswald mt-1 text-[#ff4500]">VIRTUAL CYCLING GPX INDEX</p>
                            </div>
                        </header>

                        {/* --- FILTER CONTROL PANEL --- */}
                        <div className="bg-[#4a217c] p-6 rounded-sm border border-[#6c3f9c] shadow-lg space-y-6">
                            
                            {/* Search Bar */}
                            <div className="flex gap-4 items-center bg-[#2c0c5c] p-2 rounded border border-[#6c3f9c] focus-within:border-[#00FFFF] transition-colors">
                                <Search className="text-[#00FFFF] w-6 h-6 ml-2" />
                                <input 
                                    type="text" 
                                    placeholder="Search routes by name (e.g., Flanders, Alpe...)" 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full bg-transparent text-white p-2 outline-none font-oswald tracking-wide text-lg placeholder-neutral-500" 
                                />
                            </div>

                            {/* Range Filters */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {/* Distance Filter */}
                                <div className="bg-[#2c0c5c] p-4 rounded border border-[#6c3f9c]">
                                   <label className="text-xs font-bold text-[#ff4500] uppercase font-oswald tracking-widest flex items-center gap-2 mb-3">
                                       Distance (km)
                                   </label>
                                   <div className="flex items-center gap-3">
                                       <input type="number" placeholder="Min" value={filters.distMin} onChange={(e) => handleFilterChange(e, 'distMin')} className="w-full bg-[#1a053a] text-white p-2 rounded border border-[#6c3f9c] focus:outline-none focus:border-[#00FFFF] font-roboto" />
                                       <span className="text-neutral-500 font-bold uppercase text-xs">To</span>
                                       <input type="number" placeholder="Max" value={filters.distMax} onChange={(e) => handleFilterChange(e, 'distMax')} className="w-full bg-[#1a053a] text-white p-2 rounded border border-[#6c3f9c] focus:outline-none focus:border-[#00FFFF] font-roboto" />
                                   </div>
                                </div>

                                {/* Elevation Filter */}
                                <div className="bg-[#2c0c5c] p-4 rounded border border-[#6c3f9c]">
                                   <label className="text-xs font-bold text-[#ff4500] uppercase font-oswald tracking-widest flex items-center gap-2 mb-3">
                                       Elevation (m)
                                   </label>
                                   <div className="flex items-center gap-3">
                                       <input type="number" placeholder="Min" value={filters.eleMin} onChange={(e) => handleFilterChange(e, 'eleMin')} className="w-full bg-[#1a053a] text-white p-2 rounded border border-[#6c3f9c] focus:outline-none focus:border-[#00FFFF] font-roboto" />
                                       <span className="text-neutral-500 font-bold uppercase text-xs">To</span>
                                       <input type="number" placeholder="Max" value={filters.eleMax} onChange={(e) => handleFilterChange(e, 'eleMax')} className="w-full bg-[#1a053a] text-white p-2 rounded border border-[#6c3f9c] focus:outline-none focus:border-[#00FFFF] font-roboto" />
                                   </div>
                                </div>

                                {/* Profile Score Filter */}
                                <div className="bg-[#2c0c5c] p-4 rounded border border-[#6c3f9c]">
                                   <label className="text-xs font-bold text-[#ff4500] uppercase font-oswald tracking-widest flex items-center gap-2 mb-3">
                                       Profile Score
                                   </label>
                                   <div className="flex items-center gap-3">
                                       <input type="number" placeholder="Min" value={filters.scoreMin} onChange={(e) => handleFilterChange(e, 'scoreMin')} className="w-full bg-[#1a053a] text-white p-2 rounded border border-[#6c3f9c] focus:outline-none focus:border-[#00FFFF] font-roboto" />
                                       <span className="text-neutral-500 font-bold uppercase text-xs">To</span>
                                       <input type="number" placeholder="Max" value={filters.scoreMax} onChange={(e) => handleFilterChange(e, 'scoreMax')} className="w-full bg-[#1a053a] text-white p-2 rounded border border-[#6c3f9c] focus:outline-none focus:border-[#00FFFF] font-roboto" />
                                   </div>
                                </div>
                            </div>

                            {/* Stage Type Tags */}
                            <div className="bg-[#2c0c5c] p-4 rounded border border-[#6c3f9c]">
                                <label className="text-xs font-bold text-[#ff4500] uppercase font-oswald tracking-widest block mb-3 flex items-center gap-2">
                                    <Filter className="w-4 h-4" /> Stage Types (Multi-Select)
                                </label>
                                <div className="flex flex-wrap gap-2">
                                   {uniqueStageTypes.map((type, i) => (
                                       <button 
                                            key={i}
                                            onClick={() => toggleType(type)} 
                                            className={`px-4 py-2 rounded-sm text-xs font-bold font-oswald uppercase tracking-widest border transition-colors shadow-sm ${selectedTypes.includes(type) ? 'bg-[#00FFFF] text-black border-[#00FFFF] shadow-[#00FFFF]/20' : 'bg-[#1a053a] text-neutral-300 border-[#6c3f9c] hover:border-[#00FFFF]/50'}`}
                                        >
                                           {type}
                                       </button>
                                   ))}
                                   {uniqueStageTypes.length === 0 && <span className="text-neutral-500 text-sm italic">Loading types...</span>}
                                </div>
                            </div>
                        </div>
                        {/* --- END FILTER CONTROL PANEL --- */}


                        {/* --- ROUTE TABLE --- */}
                        <div className="bg-[#4a217c] rounded-sm overflow-hidden border border-[#6c3f9c] shadow-lg">
                            <div className="p-4 bg-[#2c0c5c] border-b border-[#6c3f9c] flex justify-between items-center">
                                <h2 className="text-lg font-bold font-oswald uppercase tracking-wider text-white">
                                    Results <span className="text-[#00FFFF] ml-2">({sortedRoutes.length})</span>
                                </h2>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-neutral-400 bg-[#1a053a] uppercase text-xs font-bold tracking-wider font-oswald">
                                        <tr>
                                            <SortHeader label="Route Name" sortKey="name" />
                                            <SortHeader label="Distance (km)" sortKey="distance_km" />
                                            <SortHeader label="Elevation (m)" sortKey="elevation_m" />
                                            {/* New Columns to Replace Lat/Lon */}
                                            <SortHeader label="Profile Score" sortKey="profile_score" />
                                            <SortHeader label="Stage Type" sortKey="stage_type" />
                                            
                                            <th className="px-6 py-4 text-right">Download</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loading ? (
                                            <tr>
                                                <td colSpan="6" className="p-8 text-center text-[#00FFFF] font-bold tracking-widest uppercase animate-pulse font-oswald">
                                                    Loading Routes...
                                                </td>
                                            </tr>
                                        ) : sortedRoutes.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="p-8 text-center text-neutral-400 italic font-light">
                                                    No routes match your current filters.
                                                </td>
                                            </tr>
                                        ) : (
                                            sortedRoutes.map((route, idx) => (
                                                <tr key={idx} className="hover:bg-[#5e31a9] border-b border-[#6c3f9c] transition-colors group">
                                                    <td className="px-6 py-4 font-bold text-white text-base">
                                                        {route.name}
                                                    </td>
                                                    <td className="px-6 py-4 text-[#00FFFF] font-bold font-oswald text-lg">
                                                        {route.distance_km}
                                                    </td>
                                                    <td className="px-6 py-4 text-neutral-200 font-medium">
                                                        {route.elevation_m}
                                                    </td>
                                                    {/* Profile Score Highlight */}
                                                    <td className="px-6 py-4 font-oswald text-lg font-bold">
                                                        <span className={`px-2 py-1 rounded ${route.profile_score >= 40 ? 'bg-red-900/40 text-red-400' : route.profile_score >= 20 ? 'bg-orange-900/40 text-orange-400' : 'bg-lime-900/40 text-lime-400'}`}>
                                                            {Math.round(route.profile_score || 0)}
                                                        </span>
                                                    </td>
                                                    {/* Stage Type Text */}
                                                    <td className="px-6 py-4 text-neutral-300 capitalize">
                                                        {route.stage_type || 'N/A'}
                                                    </td>

                                                    <td className="px-6 py-4 text-right">
                                                        <button 
                                                            onClick={(e) => handleDownload(e, route.file, route.name)}
                                                            className="inline-flex p-2 bg-[#2c0c5c] hover:bg-[#00FFFF] text-neutral-300 hover:text-black border border-[#6c3f9c] hover:border-[#00FFFF] rounded transition-all shadow-md cursor-pointer"
                                                            title="Download GPX"
                                                        >
                                                            <Download className="w-4 h-4" />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
