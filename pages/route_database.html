<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Database</title>
    <!-- Same scripts and libraries from your analyzer -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');
        
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .font-roboto { font-family: 'Roboto', sans-serif; }
        body { font-family: 'Roboto', sans-serif; background-color: #2c0c5c; }
        h1, h2, h3, h4 { font-family: 'Oswald', sans-serif; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Activity = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12H18l-5 9L9 3l-5 9H2"/></svg>;
        const MapPin = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const Download = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const ArrowUpDown = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>;

        const App = () => {
            const [routes, setRoutes] = useState([]);
            const [loading, setLoading] = useState(true);
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });

            // 1. Updated to use your direct raw JSON link
            useEffect(() => {
                fetch('https://raw.githubusercontent.com/somaek/somaek.github.io/refs/heads/main/gpx/index.json')
                    .then(res => res.json())
                    .then(data => {
                        setRoutes(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Error loading routes:", err);
                        setLoading(false);
                    });
            }, []);

            // 2. New function to force a true file download from the raw GitHub URL
            const handleDownload = (e, fileName, routeName) => {
                e.preventDefault();
                const rawUrl = `https://raw.githubusercontent.com/somaek/somaek.github.io/refs/heads/main/gpx/${fileName}`;
                
                fetch(rawUrl)
                    .then(response => response.blob())
                    .then(blob => {
                        const blobUrl = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = `${routeName}.gpx`; // Forces the correct file name
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(blobUrl);
                    })
                    .catch(err => console.error('Download failed:', err));
            };

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const sortedRoutes = useMemo(() => {
                let sortableItems = [...routes];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];

                        if (aValue === null) return 1;
                        if (bValue === null) return -1;

                        if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableItems;
            }, [routes, sortConfig]);

            const SortHeader = ({ label, sortKey }) => (
                <th 
                    className="px-6 py-4 cursor-pointer hover:text-[#00FFFF] transition-colors select-none"
                    onClick={() => requestSort(sortKey)}
                >
                    <div className="flex items-center gap-2">
                        {label}
                        <ArrowUpDown className={`w-4 h-4 ${sortConfig.key === sortKey ? 'text-[#00FFFF]' : 'text-neutral-500'}`} />
                    </div>
                </th>
            );

            return (
                <div className="min-h-screen text-white selection:bg-[#00FFFF] selection:text-black p-4 md:p-8">
                    <div className="max-w-6xl mx-auto space-y-8">
                        
                        <header className="flex items-center space-x-4 border-b border-[#6c3f9c] pb-6">
                            <Activity className="w-8 h-8 text-[#00FFFF]" />
                            <div>
                                <h1 className="text-3xl font-bold tracking-wide uppercase text-white font-oswald">Route Database</h1>
                                <p className="text-neutral-300 text-sm tracking-widest uppercase font-oswald mt-1 text-[#ff4500]">VIRTUAL CYCLING GPX INDEX</p>
                            </div>
                        </header>

                        <div className="bg-[#4a217c] rounded-sm overflow-hidden border border-[#6c3f9c] shadow-lg">
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-neutral-400 bg-[#2c0c5c] uppercase text-xs font-bold tracking-wider font-oswald">
                                        <tr>
                                            <SortHeader label="Route Name" sortKey="name" />
                                            <SortHeader label="Distance (km)" sortKey="distance_km" />
                                            <SortHeader label="Elevation (m)" sortKey="elevation_m" />
                                            <SortHeader label="Location (Lat)" sortKey="lat" />
                                            <th className="px-6 py-4 text-right">Download</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loading ? (
                                            <tr>
                                                <td colSpan="5" className="p-8 text-center text-[#00FFFF] font-bold tracking-widest uppercase animate-pulse font-oswald">
                                                    Loading Routes...
                                                </td>
                                            </tr>
                                        ) : sortedRoutes.length === 0 ? (
                                            <tr>
                                                <td colSpan="5" className="p-8 text-center text-neutral-400 italic">
                                                    No routes found. Check the GitHub Action sync!
                                                </td>
                                            </tr>
                                        ) : (
                                            sortedRoutes.map((route, idx) => (
                                                <tr key={idx} className="hover:bg-[#5e31a9] border-b border-[#6c3f9c] transition-colors group">
                                                    <td className="px-6 py-4 font-bold text-white">
                                                        {route.name}
                                                    </td>
                                                    <td className="px-6 py-4 text-[#00FFFF] font-bold font-oswald text-lg">
                                                        {route.distance_km}
                                                    </td>
                                                    <td className="px-6 py-4 text-neutral-200 font-medium">
                                                        {route.elevation_m}
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        {route.lat !== null && route.lon !== null ? (
                                                            <a 
                                                                href={`https://www.google.com/maps/search/?api=1&query=${route.lat},${route.lon}`} 
                                                                target="_blank" 
                                                                rel="noreferrer"
                                                                className="flex items-center gap-2 text-neutral-400 hover:text-[#ff4500] transition-colors"
                                                            >
                                                                <MapPin className="w-4 h-4" />
                                                                {route.lat}, {route.lon}
                                                            </a>
                                                        ) : (
                                                            <span className="text-neutral-500 italic">N/A</span>
                                                        )}
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        {/* 3. Updated button to use the handleDownload function */}
                                                        <button 
                                                            onClick={(e) => handleDownload(e, route.file, route.name)}
                                                            className="inline-flex p-2 bg-[#2c0c5c] hover:bg-[#00FFFF] text-neutral-300 hover:text-black border border-[#6c3f9c] hover:border-[#00FFFF] rounded transition-all shadow-md cursor-pointer"
                                                            title="Download GPX"
                                                        >
                                                            <Download className="w-4 h-4" />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
