name: Sync GPX from Google Drive

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once a day at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install gdown
        run: pip install --upgrade gdown

      - name: Download & Mirror GPX Files
        run: |
          mkdir -p temp_download gpx

          # Run gdown via Python to gracefully catch errors and skip failed files
          python -c '
          import gdown, sys
          folder_url = "https://drive.google.com/drive/folders/1sCljOatUhO2-WRC-N9j3a1Y6Wp8xwyOU"
          try:
              gdown.download_folder(url=folder_url, output="temp_download", remaining_ok=True)
          except Exception as e:
              print(f"Warning: gdown encountered an issue: {e}", file=sys.stderr)
              print("Proceeding to sync all successfully downloaded files...")
          '

          # Locate target source directory inside temp_download
          SRC_DIR=$(find temp_download -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -z "$SRC_DIR" ]; then SRC_DIR="temp_download"; fi

          # Mirror folder tree and sync only .gpx files
          rsync -avm --include='*/' --include='*.gpx' --include='*.GPX' --exclude='*' "$SRC_DIR/" gpx/

          # Clean up temporary download directory
          rm -rf temp_download

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "sync: update GPX files from Google Drive"
          file_pattern: "gpx/**"
