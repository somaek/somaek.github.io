name: Sync GPX from Google Drive

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once a day at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install gdown
        run: pip install --upgrade gdown

      - name: Download & Mirror GPX Files
        run: |
          mkdir -p temp_download gpx

          # Wrap gdown download calls to intercept individual file failures
          python -c '
          import gdown, sys
          import gdown.download_folder as df_module

          original_download = gdown.download

          def safe_download(*args, **kwargs):
              try:
                  return original_download(*args, **kwargs)
              except (Exception, SystemExit) as e:
                  print(f"Warning: Skipped file due to download error: {e}", file=sys.stderr)
                  return None

          # Intercept single file download functions
          gdown.download = safe_download
          if hasattr(df_module, "download"):
              df_module.download = safe_download

          folder_url = "https://drive.google.com/drive/folders/1sCljOatUhO2-WRC-N9j3a1Y6Wp8xwyOU"

          try:
              gdown.download_folder(url=folder_url, output="temp_download", quiet=False)
          except Exception as e:
              print(f"Notice: Folder processing finished with message: {e}", file=sys.stderr)
          '

          # Locate target source directory inside temp_download
          SRC_DIR=$(find temp_download -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -z "$SRC_DIR" ]; then SRC_DIR="temp_download"; fi

          # Mirror folder tree and sync only .gpx files
          rsync -avm --include='*/' --include='*.gpx' --include='*.GPX' --exclude='*' "$SRC_DIR/" gpx/

          # Clean up temporary download directory
          rm -rf temp_download

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "sync: update GPX files from Google Drive"
          file_pattern: "gpx/**"
