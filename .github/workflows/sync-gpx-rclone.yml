name: Sync GPX from Google Drive

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once a day at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone

      - name: Create rclone config and Service Account file
        run: |
          # Save the secret JSON to a temporary file
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > service_account.json
          
          # Create a basic rclone configuration
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_file = $(pwd)/service_account.json
          EOF

      - name: Sync GPX Files
        run: |
          mkdir -p gpx
          
          # Copy all .gpx files from the specific Google Drive folder id
          rclone copy gdrive: gpx/ \
            --drive-root-folder-id="1sCljOatUhO2-WRC-N9j3a1Y6Wp8xwyOU" \
            --include="*.gpx" \
            --include="*.GPX" \
            -v
            
          # Clean up the sensitive service account file securely
          rm service_account.json
     
      - name: Build JSON Index
        run: |
          pip install gpxpy
          python -c '
          import os, json, gpxpy

          data = []
          # os.walk recursively searches all subfolders
          for root, dirs, files in os.walk("gpx"):
              for file in files:
                  if file.lower().endswith(".gpx"):
                      f_name = os.path.join(root, file)
                      
                      try:
                          with open(f_name, "r", encoding="utf-8") as f:
                              gpx = gpxpy.parse(f)
                              
                              # Extract metadata
                              name = gpx.name or file
                              dist = (gpx.length_2d() / 1000) if gpx.length_2d() else 0
                              up, _ = gpx.get_uphill_downhill()
                              
                              # Get starting coordinates
                              lat, lon = None, None
                              if gpx.tracks and gpx.tracks[0].segments and gpx.tracks[0].segments[0].points:
                                  pt = gpx.tracks[0].segments[0].points[0]
                                  lat, lon = round(pt.latitude, 4), round(pt.longitude, 4)
                              
                              # Save the relative path so HTML download links work
                              rel_path = os.path.relpath(f_name, "gpx")
                              
                              data.append({
                                  "file": rel_path,
                                  "name": name,
                                  "distance_km": round(dist, 2),
                                  "elevation_m": round(up if up else 0, 1),
                                  "lat": lat,
                                  "lon": lon
                              })
                      except Exception as e:
                          print(f"Skipped {f_name}: {e}")
                  
          with open("gpx/index.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          '
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update GPX files from Google Drive using rclone"
          file_pattern: "gpx/**"
