name: Sync GPX from Google Drive

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once a day at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone

      - name: Create rclone config and Service Account file
        run: |
          # Save the secret JSON to a temporary file
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > service_account.json
          
          # Create a basic rclone configuration
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_file = $(pwd)/service_account.json
          EOF

      - name: Sync GPX and JSON Files
        run: |
          mkdir -p gpx
          
          # Copy all .gpx and .json files from the specific Google Drive folder id
          rclone sync gdrive: gpx/ \
            --drive-root-folder-id="1sCljOatUhO2-WRC-N9j3a1Y6Wp8xwyOU" \
            --include="*.gpx" \
            --include="*.GPX" \
            --include="*.json" \
            --include="*.JSON" \
            --exclude="index.json" \
            -v
            
          # Clean up the sensitive service account file securely
          rm service_account.json
     
